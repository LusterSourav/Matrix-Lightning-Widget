upstream element { server element:80; }
upstream synapse { server synapse:8008; }
upstream clnrest { server lightningd-a:3010; }

server {
    listen 80;
    server_name citadel.test citadel.local localhost;

    # ponytail: single origin solves Matrix widget postMessage origin mismatch
    add_header Content-Security-Policy "frame-src 'self'; script-src 'self' 'unsafe-inline'";
    add_header X-Frame-Options SAMEORIGIN;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location /_matrix {
        proxy_pass http://synapse;
    }

    location /clnrest/ {
        proxy_pass http://clnrest/;
        proxy_set_header Host $host;
        __RUNE_LINE__
    }

    location / {
        proxy_pass http://element;
    }
}
